<table class="table table-stripped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Blood</th>
            <th>Prescription</th>
            <th>Dose</th>
            <th>Urgency</th>
        </tr>
    </thead>
    <tbody>
        @for (patient of patients; track patient.id) {
        <tr>
            <td>{{ patient.id }}</td>
            <td>{{ patient.name }}</td>
            <td>{{ patient.age }}</td>
            <td>{{ patient.blood }}</td>
            <td>{{ patient.prescription }}</td>
            <td>{{ patient.dose }}</td>
            <td>{{ patient.urgency }}</td>
        </tr>
        }
    </tbody>
</table>
