<div class="container">
    <h2 class="text-center">{{ isEditMode ? 'Update Appointment' : 'Add New Appointment' }}</h2>
    @if (errorMessage) {
        <div class="alert alert-danger" role="alert">{{ errorMessage }}</div>
    }
    @if (isLoading) {
        <div class="alert alert-info" role="status">Loading appointment...</div>
    }
    @if (!isEditMode || appointmentLoaded) {
    <form (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label for="name">Name:</label>
            <input
            type="text"
            id="name"
            placeholder="Enter Name"
            class="form-control"
            [(ngModel)]="appointment.name"
            name="name"
            required
            />
        </div>
        <div class="form-group">
            <label for="age">Age:</label>
            <input
            type="number"
            id="age"
            class="form-control"
            [(ngModel)]="appointment.age"
            name="age"
            required
            />
        </div>
        <div class="form-group">
            <label for="symptoms">Symptoms:</label>
            <input
            type="text"
            id="symptoms"
            class="form-control"
            [(ngModel)]="appointment.symptoms"
            name="symptoms"
            required
            />
        </div>
        <div class="form-group">
            <label for="number">Number:</label>
            <input
            type="text"
            id="number"
            class="form-control"
            [(ngModel)]="appointment.number"
            name="number"
            required
            />
        </div>
        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-success">{{ isEditMode ? 'Update' : 'Submit' }}</button>
            <button type="button" class="btn btn-secondary" routerLink="/appointmentlist">Cancel</button>
        </div>
    </form>
    }
</div>
